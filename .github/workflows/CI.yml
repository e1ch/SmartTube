name: Build & Release

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Original SmartTube branch/tag/ref to patch"
        required: false
        default: "ash-base"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build original SmartTube with Ash patches
        id: build
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'ash-base' }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x scripts/apply-ash-patches.sh scripts/build-upstream-with-patches.sh
          scripts/build-upstream-with-patches.sh
          ls -la release_assets/

      - name: Generate Release Notes
        run: |
          {
            echo "## v${{ steps.build.outputs.VERSION_NAME }} (build ${{ github.run_number }})"
            echo
            echo "Auto-built from original SmartTube \`${{ steps.build.outputs.UPSTREAM_RESOLVED_REF }}\` + Ash patches at commit \`${{ github.sha }}\`"
            echo
            echo "Patch base: \`${{ steps.build.outputs.PATCH_BASE_REF }}\`"
            echo
            if [ -f .github/release-notes.md ]; then
              cat .github/release-notes.md
              echo
            fi
            echo "### Recent commits"
            git log --pretty='- %s' -n 12
            echo
            echo "### Download"
            echo "| Variant | ABI | Link |"
            echo "|---------|-----|------|"
            echo "| Beta | armeabi-v7a | [Download](https://github.com/${{ github.repository }}/releases/download/release/SmartTube_beta_armeabi-v7a.apk) |"
            echo "| Beta | arm64-v8a | [Download](https://github.com/${{ github.repository }}/releases/download/release/SmartTube_beta_arm64-v8a.apk) |"
            echo "| Beta | universal | [Download](https://github.com/${{ github.repository }}/releases/download/release/SmartTube_beta_universal.apk) |"
            echo "| Stable | armeabi-v7a | [Download](https://github.com/${{ github.repository }}/releases/download/release/SmartTube_stable_armeabi-v7a.apk) |"
          } > release_notes.txt

      - name: Delete Old Release
        run: |
          gh release delete release --yes 2>/dev/null || true
          git push origin :refs/tags/release 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        run: |
          gh release create release \
            --title "v${{ steps.build.outputs.VERSION_NAME }}" \
            --notes-file release_notes.txt \
            release_assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube_v${{ steps.build.outputs.VERSION_NAME }}
          path: release_assets/*.apk
          if-no-files-found: error
          retention-days: 3
